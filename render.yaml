services:
  type: web
  name: wealth-wise
  runtime: python
  plan: free
  buildCommard: pip install -r requirements.txt && python -m data.seed
  startCommard: gunicorn app:app --bind 0.0.0:$PORT
  envVARS:
    - key: PYTHON_VERSION
      value: 3.11.11
    - key: SECRET_KEY
      generateValue: true
    - key: CURRENCY_SYMBOL
      value: R
    - key: DATABASE_URL
      value: sqlite:///data/finance.db